services:
  - type: web
    runtime: static
    name: punar
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      # React Router uses client-side routing (BrowserRouter) — without
      # this, refreshing /bills or /todos directly 404s on Render.
      - type: rewrite
        source: /*
        destination: /index.html
